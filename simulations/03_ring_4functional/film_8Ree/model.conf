# Production simulation: Tetrafunctional rings, film_8Ree
strand_topology = ring
strand_length = 160
strand_count = 750
strand_functionality = 4
strand_reactive_distribution = regular

# Common crosslinker and stoichiometry controls
crosslinker_length = 32
functionality = 4
stoichiometry = 1:1

# Optional components are disabled for this comparison.
moderator_count = 0

# Common preparation and conversion controls
density = 0.05
target_density = 0.8
target_conversion = 95

# Identical reactive-site and placement seeds are used in all six cases.
crosslink_distribution = random
crosslink_seed = 20260722
seed = 5489

# run.sh supplies --thickness = 8 * BULK_REE_ANGSTROM.
# thickness = 8 * BULK_REE_ANGSTROM
output = data.ring_4functional_film_8Ree
