# Production simulation: Bifunctional linear reference, film_4Ree
strand_topology = linear
strand_length = 80
strand_count = 1500
strand_functionality = 2

# Common crosslinker and stoichiometry controls
crosslinker_length = 32
functionality = 4
stoichiometry = 1:1

# Optional components are disabled for this comparison.
moderator_count = 0

# Common preparation and conversion controls
density = 0.05
target_density = 0.8
target_conversion = 95

# Identical reactive-site and placement seeds are used in all five cases.
crosslink_distribution = random
crosslink_seed = 20260722
seed = 5489

# run.sh supplies --thickness = 4 * BULK_REE_ANGSTROM.
# thickness = 4 * BULK_REE_ANGSTROM
output = data.linear_reference_film_4Ree
